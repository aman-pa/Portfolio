<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <!-- Background -->
  <rect width="1200" height="675" fill="#0A0E27"/>
  
  <!-- Glowing Gradients matching live website css -->
  <circle cx="250" cy="200" r="350" fill="url(#grad1)" opacity="0.35"/>
  <circle cx="950" cy="500" r="300" fill="url(#grad2)" opacity="0.25"/>
  
  <!-- Grid Lines -->
  <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200M0 600H1200" stroke="#FF6B35" stroke-opacity="0.08" stroke-width="1"/>
  <path d="M200 0V675M400 0V675M600 0V675M800 0V675M1000 0V675" stroke="#FF6B35" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Top Navbar Mock -->
  <rect x="40" y="30" width="1120" height="60" rx="16" fill="#0F1538" stroke="#FF6B35" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="70" cy="60" r="14" fill="url(#brandGrad)"/>
  <text x="95" y="66" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="900" font-size="20" letter-spacing="2">HUMANITY OS</text>
  
  <rect x="980" y="45" width="150" height="30" rx="15" fill="url(#brandGrad)"/>
  <text x="1012" y="65" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="12" letter-spacing="1">LIVE DASHBOARD</text>

  <!-- Hero Headline Content -->
  <rect x="40" y="120" width="1120" height="515" rx="24" fill="#0D1233" stroke="#FF6B35" stroke-opacity="0.2" stroke-width="1"/>

  <rect x="80" y="160" width="160" height="32" rx="16" fill="#FF6B35" fill-opacity="0.15" stroke="#FF6B35" stroke-opacity="0.4"/>
  <text x="100" y="181" fill="#F7931E" font-family="system-ui, sans-serif" font-weight="700" font-size="12" letter-spacing="1">GLOBAL REBUILD SYSTEM</text>

  <text x="80" y="250" fill="url(#brandGrad)" font-family="system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="-1">CLIMATE SYSTEMS COLLAPSING</text>
  <text x="80" y="290" fill="#F7931E" font-family="system-ui, sans-serif" font-weight="600" font-size="18" letter-spacing="3">UNIFIED CRISIS & RISK DASHBOARD</text>

  <text x="80" y="335" fill="#E2E8F0" font-family="system-ui, sans-serif" font-weight="400" font-size="16" opacity="0.8">Interactive environmental exploration platform analyzing global climate risks, root causes, and future mitigation.</text>

  <!-- Stat Cards Row -->
  <g transform="translate(80, 370)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="320" height="130" rx="16" fill="#141B47" stroke="#FF6B35" stroke-opacity="0.3"/>
    <text x="25" y="50" fill="url(#brandGrad)" font-family="system-ui, sans-serif" font-weight="900" font-size="36">+30%</text>
    <text x="25" y="80" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="14">AWARENESS IMPACT</text>
    <text x="25" y="100" fill="#94A3B8" font-family="system-ui, sans-serif" font-weight="400" font-size="12">Interactive visual data engagement</text>

    <!-- Card 2 -->
    <rect x="350" y="0" width="320" height="130" rx="16" fill="#141B47" stroke="#FF6B35" stroke-opacity="0.3"/>
    <text x="375" y="50" fill="url(#brandGrad)" font-family="system-ui, sans-serif" font-weight="900" font-size="36">100%</text>
    <text x="375" y="80" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="14">RESPONSIVE FLOW</text>
    <text x="375" y="100" fill="#94A3B8" font-family="system-ui, sans-serif" font-weight="400" font-size="12">Multi-page HTML5/CSS3/JS architecture</text>

    <!-- Card 3 -->
    <rect x="700" y="0" width="320" height="130" rx="16" fill="#141B47" stroke="#FF6B35" stroke-opacity="0.3"/>
    <text x="725" y="50" fill="url(#brandGrad)" font-family="system-ui, sans-serif" font-weight="900" font-size="36">LIVE</text>
    <text x="725" y="80" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="14">GITHUB PAGES</text>
    <text x="725" y="100" fill="#94A3B8" font-family="system-ui, sans-serif" font-weight="400" font-size="12">Deployed &amp; fully accessible</text>
  </g>

  <!-- Live URL Bar at Bottom -->
  <rect x="80" y="530" width="1040" height="50" rx="12" fill="#0A0E27" stroke="#FF6B35" stroke-opacity="0.4"/>
  <circle cx="110" cy="555" r="6" fill="#10B981"/>
  <text x="130" y="560" fill="#F7931E" font-family="monospace" font-weight="700" font-size="14">https://aman-pa.github.io/Hackathonn/</text>

  <defs>
    <radialGradient id="grad1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 200) rotate(90) scale(350)">
      <stop stop-color="#FF6B35"/>
      <stop offset="1" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grad2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(950 500) rotate(90) scale(300)">
      <stop stop-color="#F7931E"/>
      <stop offset="1" stop-color="#F7931E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="50%" stop-color="#F7931E"/>
      <stop offset="100%" stop-color="#FFCD3C"/>
    </linearGradient>
  </defs>
</svg>
